<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Boutique | Refugios del Sur</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zahara: '#F9F9F6',
                        carbon: '#2A2927',
                        terracota: '#DFB69F',
                        salvia: '#7E8D7B',
                        fondo: '#EAEAE6' 
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-fondo min-h-screen p-4 md:p-8 font-sans text-carbon antialiased">

    <!-- LOGIN -->
    <div id="login-section" class="max-w-md mx-auto bg-zahara p-10 rounded-2xl shadow-lg border border-carbon/5 mt-20">
        <h2 class="text-3xl font-serif text-center mb-8 text-carbon">Acceso Privado</h2>
        <!-- Formulario restaurado a su versión más robusta -->
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-carbon/70 mb-1.5">Email corporativo</label>
                <input type="email" id="login-email" required class="w-full px-4 py-3 bg-white border border-carbon/10 rounded-lg focus:border-terracota outline-none font-light">
            </div>
            <div>
                <label class="block text-sm font-medium text-carbon/70 mb-1.5">Contraseña</label>
                <input type="password" id="login-password" required class="w-full px-4 py-3 bg-white border border-carbon/10 rounded-lg focus:border-terracota outline-none font-light">
            </div>
            <!-- Botón tipo submit estándar -->
            <button type="submit" id="login-btn" class="w-full bg-salvia text-white py-3.5 rounded-lg font-medium tracking-wide hover:bg-[#6c7a69] transition-colors mt-2">
                Acceder al despacho
            </button>
            <div id="login-error" class="bg-red-50 p-4 mt-4 rounded-lg hidden border border-red-100">
                <p class="text-red-600 text-sm font-medium" id="login-error-text"></p>
            </div>
        </form>
    </div>

    <!-- PANEL ADMINISTRADOR -->
    <div id="admin-section" class="hidden max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8 bg-zahara px-8 py-5 rounded-2xl shadow-sm border border-carbon/5">
            <div class="flex gap-6">
                <button onclick="switchTab('add')" id="btn-tab-add" class="font-medium text-carbon border-b-2 border-carbon pb-1 transition-colors focus:outline-none">Nueva Propiedad</button>
                <button onclick="switchTab('catalog')" id="btn-tab-catalog" class="font-light text-carbon/50 hover:text-carbon pb-1 transition-colors focus:outline-none">Cartera de Inmuebles</button>
                <button onclick="switchTab('leads')" id="btn-tab-leads" class="font-light text-carbon/50 hover:text-carbon pb-1 transition-colors focus:outline-none">Solicitudes</button>
            </div>
            <div class="flex items-center gap-6">
                <span id="realtime-status" class="flex items-center gap-2 text-xs font-medium text-salvia bg-salvia/10 px-3 py-1.5 rounded-full">
                    <span class="w-2 h-2 bg-salvia rounded-full animate-pulse"></span> Conectado
                </span>
                <button onclick="logout()" class="text-sm text-carbon/50 hover:text-carbon font-medium transition-colors focus:outline-none">Cerrar Sesión</button>
            </div>
        </div>

        <!-- FORMULARIO PROPIEDAD -->
        <div id="tab-add" class="bg-zahara p-8 md:p-12 rounded-2xl shadow-sm border border-carbon/5">
            <h1 class="text-3xl font-serif text-carbon mb-8" id="form-title">Añadir Nueva Propiedad</h1>
            <form id="property-form" class="space-y-8">
                <input type="hidden" id="property-id">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-sm font-medium text-carbon/70 mb-1.5">Título / Referencia *</label>
                        <input type="text" id="title" required placeholder="Ej: Villa luminosa en Atlanterra" class="w-full px-4 py-3 bg-white border border-carbon/10 rounded-lg outline-none font-light focus:border-terracota">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-carbon/70 mb-1.5">Precio (€) *</label>
                        <input type="number" id="price" required placeholder="Ej: 850000" class="w-full px-4 py-3 bg-white border border-carbon/10 rounded-lg outline-none font-light focus:border-terracota">
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-sm font-medium text-carbon/70 mb-1.5">Ubicación *</label>
                        <input type="text" id="location" required placeholder="Ej: Zahara Centro" class="w-full px-4 py-3 bg-white border border-carbon/10 rounded-lg outline-none font-light focus:border-terracota">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-carbon/70 mb-1.5">Habitaciones</label>
                        <input type="number" id="bedrooms" min="0" placeholder="0" class="w-full px-4 py-3 bg-white border border-carbon/10 rounded-lg outline-none font-light focus:border-terracota">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-carbon/70 mb-1.5">Baños</label>
                        <input type="number" id="bathrooms" min="0" placeholder="0" class="w-full px-4 py-3 bg-white border border-carbon/10 rounded-lg outline-none font-light focus:border-terracota">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-carbon/70 mb-1.5">Metros (m²)</label>
                        <input type="number" id="sqm" min="0" placeholder="0" class="w-full px-4 py-3 bg-white border border-carbon/10 rounded-lg outline-none font-light focus:border-terracota">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-carbon/70 mb-1.5">Descripción de la vivienda</label>
                        <textarea id="description" rows="5" placeholder="Sensaciones, luz, orientación, calidades..." class="w-full px-4 py-3 bg-white border border-carbon/10 rounded-lg outline-none font-light resize-none focus:border-terracota"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-carbon/70 mb-1.5">Datos Legales / Administrativos</label>
                        <textarea id="legal-info" rows="5" placeholder="Certificado Energético (CEE), IBI, gastos de comunidad, registro..." class="w-full px-4 py-3 bg-white border border-carbon/10 rounded-lg outline-none font-light resize-none focus:border-terracota"></textarea>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl border border-carbon/5">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="font-medium text-carbon mb-1">Fotografías del Inmueble</h3>
                            <p class="text-xs font-light text-carbon/50">Sube todas las fotos de golpe. La primera será la portada.</p>
                        </div>
                        <button type="button" onclick="openCloudinaryWidget()" class="bg-carbon text-zahara px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-carbon/80 transition-colors">Subir Fotos</button>
                    </div>
                    <input type="hidden" id="image-urls">
                    <div id="preview-images" class="flex gap-4 flex-wrap mt-4 min-h-[5rem] items-center">
                        <span class="text-sm font-light text-carbon/40 italic">Aún no hay fotos...</span>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-6 items-center bg-white p-6 rounded-xl border border-carbon/5">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="is-visible" class="w-5 h-5 rounded text-terracota cursor-pointer border-carbon/20" checked>
                        <span class="text-sm font-medium text-carbon">Inmueble Público en la web</span>
                    </label>
                    <div class="w-px h-6 bg-carbon/10 hidden md:block"></div>
                    <div class="flex items-center gap-3">
                        <label class="text-sm font-medium text-carbon">Estado:</label>
                        <select id="status" class="bg-zahara border border-carbon/10 text-sm rounded-lg px-4 py-2 outline-none">
                            <option value="Disponible">Disponible</option>
                            <option value="Reservado">Reservado</option>
                            <option value="Vendido">Vendido</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 border-t border-carbon/5">
                    <button type="submit" id="submit-btn" class="w-full md:w-auto md:px-12 bg-salvia text-white font-medium py-4 rounded-lg tracking-wide hover:bg-[#6c7a69] transition-colors shadow-sm">
                        Guardar Propiedad
                    </button>
                </div>
            </form>
        </div>

        <!-- CARTERA -->
        <div id="tab-catalog" class="hidden bg-zahara p-8 rounded-2xl shadow-sm border border-carbon/5">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-carbon/10 text-sm text-carbon/60">
                            <th class="py-4 font-medium">Inmueble</th><th class="py-4 font-medium">Precio</th>
                            <th class="py-4 font-medium">Ubicación</th><th class="py-4 font-medium">Estado</th><th class="py-4 font-medium text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="catalog-body" class="text-sm"></tbody>
                </table>
            </div>
        </div>

        <!-- SOLICITUDES -->
        <div id="tab-leads" class="hidden bg-zahara p-8 rounded-2xl shadow-sm border border-carbon/5">
            <h2 class="text-2xl font-serif text-carbon mb-6">Solicitudes de Visita y Contacto</h2>
            <div id="leads-container" class="grid gap-4"></div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN SUPABASE
        const supabaseUrl = 'https://zqsoagqdypchtdtcudre.supabase.co'; 
        const supabaseAnonKey = 'sb_publishable_YUCsQxlUtRpWUiyb1EahFw_Q-o-0grz';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        const CLOUDINARY_CLOUD_NAME = 'dkg1ytbxb'; 
        const CLOUDINARY_UPLOAD_PRESET = 'tienda_ropa'; 

        // ==========================================
        // LOGIN BLINDADO (Event Listener en el form)
        // ==========================================
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault(); // Detenemos la recarga nativa para que la sesión viva
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('login-error');
            const errorText = document.getElementById('login-error-text');

            btn.innerText = 'Verificando credenciales...';
            btn.disabled = true;
            errorDiv.classList.add('hidden');

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) {
                    errorText.innerText = "Error: " + error.message;
                    errorDiv.classList.remove('hidden');
                    btn.innerText = 'Acceder al despacho';
                    btn.disabled = false;
                } else {
                    // Si entra, ocultamos la pantalla de login sin recargar la página web
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('admin-section').classList.remove('hidden');
                    loadCatalog(); 
                    setupRealtime();
                }
            } catch (err) {
                errorText.innerText = "Error de conexión: " + err.message;
                errorDiv.classList.remove('hidden');
                btn.innerText = 'Acceder al despacho';
                btn.disabled = false;
            }
        });

        // CERRAR SESIÓN
        async function logout() { 
            await supabase.auth.signOut(); 
            document.getElementById('admin-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-btn').innerText = 'Acceder al despacho';
            document.getElementById('login-btn').disabled = false;
        }

        // AUTO-LOGIN SI YA TIENES LA SESIÓN ABIERTA
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                loadCatalog(); 
                setupRealtime();
            }
        });

        // ==========================================
        // RESTO DE LÓGICA (CASAS Y LEADS)
        // ==========================================

        function setupRealtime() {
            supabase.channel('schema-db-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'properties' }, () => {
                    if (!document.getElementById('tab-catalog').classList.contains('hidden')) loadCatalog();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'leads' }, () => {
                    if (!document.getElementById('tab-leads').classList.contains('hidden')) loadLeads();
                })
                .subscribe((status) => {
                    const statusEl = document.getElementById('realtime-status');
                    if (status === 'SUBSCRIBED') {
                        statusEl.innerHTML = `<span class="w-2 h-2 bg-salvia rounded-full animate-pulse"></span> Conectado`;
                        statusEl.className = 'flex items-center gap-2 text-xs font-medium text-salvia bg-salvia/10 px-3 py-1.5 rounded-full';
                    }
                });
        }

        function switchTab(tabId) {
            document.getElementById('tab-add').classList.add('hidden');
            document.getElementById('tab-catalog').classList.add('hidden');
            document.getElementById('tab-leads').classList.add('hidden');
            ['add', 'catalog', 'leads'].forEach(id => { document.getElementById(`btn-tab-${id}`).className = 'font-light text-carbon/50 hover:text-carbon pb-1 focus:outline-none transition-colors'; });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`btn-tab-${tabId}`).className = 'font-medium text-carbon border-b-2 border-carbon pb-1 focus:outline-none transition-colors'; 
            if (tabId === 'add' && !document.getElementById('property-id').value) resetPropertyForm();
            if (tabId === 'catalog') loadCatalog();
            if (tabId === 'leads') loadLeads();
        }

        function openCloudinaryWidget() {
            cloudinary.openUploadWidget({ cloudName: CLOUDINARY_CLOUD_NAME, uploadPreset: CLOUDINARY_UPLOAD_PRESET, multiple: true }, (error, result) => {
                if (!error && result && result.event === "success") {
                    const input = document.getElementById('image-urls');
                    let currentUrls = input.value ? input.value.split(',') : [];
                    currentUrls.push(result.info.secure_url);
                    input.value = currentUrls.join(',');
                    renderImagePreviews();
                }
            });
        }

        function renderImagePreviews() {
            const input = document.getElementById('image-urls'); const container = document.getElementById('preview-images');
            container.innerHTML = '';
            if (!input.value) { container.innerHTML = '<span class="text-sm font-light text-carbon/40 italic">Aún no hay fotos...</span>'; return; }
            input.value.split(',').forEach((url, index) => {
                if(url.trim() === '') return;
                const wrap = document.createElement('div'); wrap.className = "relative inline-block";
                wrap.innerHTML = `<img src="${url}" class="h-24 w-24 object-cover rounded-lg border border-carbon/10 shadow-sm"><button type="button" onclick="removeImage(${index})" class="absolute -top-2 -right-2 bg-zahara text-carbon border border-carbon/10 rounded-full w-6 h-6 flex items-center justify-center text-xs hover:bg-carbon hover:text-zahara transition-colors">&times;</button>`;
                container.appendChild(wrap);
            });
        }

        window.removeImage = function(index) {
            const input = document.getElementById('image-urls'); let urls = input.value.split(','); urls.splice(index, 1);
            input.value = urls.join(','); renderImagePreviews();
        };

        function resetPropertyForm() {
            document.getElementById('property-form').reset(); document.getElementById('property-id').value = '';
            document.getElementById('image-urls').value = ''; document.getElementById('form-title').innerText = 'Añadir Nueva Propiedad';
            document.getElementById('is-visible').checked = true; document.getElementById('status').value = 'Disponible'; renderImagePreviews();
        }

        document.getElementById('property-form').addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = document.getElementById('submit-btn');
            btn.innerText = 'Guardando...'; btn.disabled = true;
            try {
                const idString = document.getElementById('property-id').value;
                const data = {
                    title: document.getElementById('title').value,
                    price: parseFloat(document.getElementById('price').value) || 0, location: document.getElementById('location').value,
                    bedrooms: parseInt(document.getElementById('bedrooms').value) || 0, bathrooms: parseInt(document.getElementById('bathrooms').value) || 0,
                    sqm: parseFloat(document.getElementById('sqm').value) || 0, description: document.getElementById('description').value,
                    legal_info: document.getElementById('legal-info').value, image_urls: document.getElementById('image-urls').value,
                    is_visible: document.getElementById('is-visible').checked, status: document.getElementById('status').value
                };
                if (idString) { const { error } = await supabase.from('properties').update(data).eq('id', parseInt(idString)); if (error) throw error; } 
                else { const { error } = await supabase.from('properties').insert([data]); if (error) throw error; }
                btn.innerText = '¡Guardado correctamente!'; btn.classList.replace('bg-salvia', 'bg-[#7e8d7b]'); 
                setTimeout(() => { resetPropertyForm(); switchTab('catalog'); btn.innerText = 'Guardar Propiedad'; btn.disabled = false; }, 1200);
            } catch (err) { alert('Error: ' + err.message); btn.innerText = 'Guardar Propiedad'; btn.disabled = false; }
        });

        window.editProperty = async function(id) {
            const { data: prop, error } = await supabase.from('properties').select('*').eq('id', parseInt(id)).single();
            if (error) return alert("Error al cargar");
            document.getElementById('property-id').value = prop.id; document.getElementById('title').value = prop.title;
            document.getElementById('price').value = prop.price; document.getElementById('location').value = prop.location;
            document.getElementById('bedrooms').value = prop.bedrooms || ''; document.getElementById('bathrooms').value = prop.bathrooms || '';
            document.getElementById('sqm').value = prop.sqm || ''; document.getElementById('description').value = prop.description || '';
            document.getElementById('legal-info').value = prop.legal_info || ''; document.getElementById('image-urls').value = prop.image_urls || '';
            document.getElementById('is-visible').checked = prop.is_visible; document.getElementById('status').value = prop.status || 'Disponible';
            renderImagePreviews(); document.getElementById('form-title').innerText = 'Editar Propiedad'; switchTab('add');
        };

        window.deleteProperty = async function(id) {
            if (confirm('¿Eliminar esta propiedad?')) { const { error } = await supabase.from('properties').delete().eq('id', parseInt(id)); if (error) alert('Error: ' + error.message); else loadCatalog(); }
        };

        async function loadCatalog() {
            const tbody = document.getElementById('catalog-body'); tbody.innerHTML = '<tr><td colspan="5" class="py-4">Cargando...</td></tr>';
            const { data, error } = await supabase.from('properties').select('*').order('created_at', { ascending: false });
            if (error) return tbody.innerHTML = `<tr><td colspan="5" class="text-red-500">Error: ${error.message}</td></tr>`;
            if (!data || data.length === 0) return tbody.innerHTML = '<tr><td colspan="5">No hay propiedades.</td></tr>';
            let html = '';
            data.forEach(p => {
                const imgUrl = p.image_urls ? p.image_urls.split(',')[0] : '';
                const formatPrice = new Intl.NumberFormat('es-ES').format(p.price) + ' €';
                const statusColor = p.status === 'Vendido' ? 'bg-carbon text-zahara' : (p.status === 'Reservado' ? 'bg-terracota/20 text-terracota' : 'bg-salvia/20 text-salvia');
                html += `<tr class="border-b border-carbon/5">
                        <td class="py-3 flex gap-4"><img src="${imgUrl}" class="w-12 h-12 object-cover rounded border">
                            <div><span class="font-medium block">${p.title} ${p.is_visible ? '👀' : '🙈'}</span><span class="text-xs text-carbon/60">${p.bedrooms} Hab • ${p.bathrooms} Baños • ${p.sqm} m²</span></div></td>
                        <td class="py-3 font-medium">${formatPrice}</td><td class="py-3">${p.location}</td>
                        <td class="py-3"><span class="text-xs px-2 py-1 rounded-full ${statusColor}">${p.status}</span></td>
                        <td class="py-3 text-right"><button onclick="editProperty('${p.id}')" class="text-carbon/60 hover:text-carbon mr-3">Editar</button><button onclick="deleteProperty('${p.id}')" class="text-red-400 hover:text-red-600">Borrar</button></td>
                    </tr>`;
            });
            tbody.innerHTML = html;
        }

        async function loadLeads() {
            const container = document.getElementById('leads-container'); container.innerHTML = '<p>Cargando...</p>';
            const { data, error } = await supabase.from('leads').select('*').order('created_at', { ascending: false });
            if (error) return container.innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
            if (!data || data.length === 0) return container.innerHTML = '<p>No hay solicitudes.</p>';
            let html = '';
            data.forEach(lead => {
                const date = new Date(lead.created_at).toLocaleDateString('es-ES', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
                const isPending = lead.status === 'Pendiente';
                html += `<div class="bg-white p-5 rounded-xl border shadow-sm flex flex-col md:flex-row justify-between gap-4">
                        <div><div class="flex items-center gap-3 mb-2"><h3 class="font-serif text-lg text-carbon">${lead.customer_name}</h3><span class="text-xs font-medium px-2 py-1 rounded-full ${isPending ? 'bg-terracota/20 text-terracota' : 'bg-salvia/20 text-salvia'}">${lead.status}</span><span class="text-xs">${date}</span></div>
                            <p class="text-sm font-light text-carbon/80 mb-1">📞 ${lead.customer_phone} &nbsp;|&nbsp; ✉️ ${lead.customer_email}</p>
                            <p class="text-sm text-carbon mb-3">🏡 Interés en: <strong>${lead.property_title || 'Propiedad'}</strong></p>
                            ${lead.message ? `<div class="bg-fondo p-3 rounded-lg text-sm italic">"${lead.message}"</div>` : ''}</div>
                        <div class="flex flex-row md:flex-col gap-2 shrink-0">
                            ${isPending ? `<button onclick="updateLeadStatus('${lead.id}', 'Contactado')" class="bg-zahara border border-carbon text-carbon text-xs font-medium px-4 py-2 rounded">Marcar Contactado</button>` : ''}
                            <button onclick="updateLeadStatus('${lead.id}', 'Descartado')" class="text-carbon/40 hover:text-red-500 text-xs">Descartar</button>
                        </div></div>`;
            });
            container.innerHTML = html;
        }

        window.updateLeadStatus = async function(id, newStatus) {
            const { error } = await supabase.from('leads').update({ status: newStatus }).eq('id', parseInt(id));
            if (!error) loadLeads();
        };
    </script>
</body>
</html>
